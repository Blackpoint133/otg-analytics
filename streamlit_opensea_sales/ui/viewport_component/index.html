<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    html,
    body {
      background: transparent;
      margin: 0;
      min-height: 0;
      overflow: hidden;
      padding: 0;
    }
  </style>
</head>
<body>
  <script>
    const BREAKPOINT = 768;
    const WIDTH_DELTA = 24;
    const DEBOUNCE_MS = 200;
    let lastSent = null;
    let resizeTimer = null;

    function sendStreamlitMessage(type, data) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type: type }, data || {}),
        "*"
      );
    }

    function setComponentReady() {
      sendStreamlitMessage("streamlit:componentReady", { apiVersion: 1 });
    }

    function setFrameHeight(height) {
      sendStreamlitMessage("streamlit:setFrameHeight", { height: height });
    }

    function setComponentValue(value) {
      sendStreamlitMessage("streamlit:setComponentValue", {
        value: value,
        dataType: "json"
      });
    }

    function currentViewport() {
      let rawWidth = 0;
      try {
        rawWidth = window.top && window.top.innerWidth ? window.top.innerWidth : 0;
      } catch (error) {
        rawWidth = 0;
      }
      if (!rawWidth) {
        try {
          rawWidth = window.parent && window.parent.innerWidth ? window.parent.innerWidth : 0;
        } catch (error) {
          rawWidth = 0;
        }
      }
      const width = Math.round(rawWidth || window.innerWidth || document.documentElement.clientWidth || 0);
      return {
        isMobile: width <= BREAKPOINT,
        width: width
      };
    }

    function shouldSend(nextValue) {
      if (!lastSent) {
        return true;
      }
      if (nextValue.isMobile !== lastSent.isMobile) {
        return true;
      }
      return Math.abs(nextValue.width - lastSent.width) >= WIDTH_DELTA;
    }

    function publishViewport() {
      const value = currentViewport();
      if (!value.width || !shouldSend(value)) {
        return;
      }
      lastSent = value;
      setComponentValue(value);
      setFrameHeight(0);
    }

    function debouncePublish() {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(publishViewport, DEBOUNCE_MS);
    }

    window.addEventListener("resize", debouncePublish, { passive: true });
    setComponentReady();
    setFrameHeight(0);
    publishViewport();
  </script>
</body>
</html>
