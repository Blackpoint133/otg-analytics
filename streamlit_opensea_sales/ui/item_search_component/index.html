<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:inherit}.wrap{width:100%}.input-wrap{display:flex;align-items:center;width:100%;height:34px;background:#080808;border:1px solid #ff003a}.selected-diamond,.diamond{width:8px;height:8px;flex:0 0 8px;transform:rotate(45deg);background:#fff;border:1px solid #303035}.selected-diamond{display:none;margin-left:9px;margin-right:8px}.input-wrap.selected .selected-diamond{display:block}input{flex:1;min-width:0;height:32px;padding:7px 9px;background:transparent;color:#fff;border:0;outline:0;font-size:13px;line-height:18px}.selected input{padding-left:0}.panel{margin-top:2px;background:#080808;border:1px solid #303035}.row,.none{height:30px;padding:6px 9px;font-size:13px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #303035}.row{cursor:pointer}.row:hover,.row.active{background:#151515;color:#ff003a}.none{color:#999}
</style></head><body><div class="wrap"><div id="iw" class="input-wrap"><span id="sd" class="selected-diamond"></span><input id="q" placeholder="Search item" autocomplete="off"></div><div id="p" class="panel" hidden></div></div><script>(function(){var q=document.getElementById('q'),p=document.getElementById('p'),iw=document.getElementById('iw'),sd=document.getElementById('sd'),records=[],selected=null,initialized=false,active=-1;function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}function send(v){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v,dataType:'json'},'*')}function matches(query){var text=String(query||'').trim().toLowerCase();if(!text)return [];return records.filter(function(r){return String(r.display_name||'').toLowerCase().indexOf(text)>=0}).sort(function(a,b){return String(a.display_name||'').toLowerCase().localeCompare(String(b.display_name||'').toLowerCase())||String(a.item_key||'').toLowerCase().localeCompare(String(b.item_key||'').toLowerCase())}).slice(0,10)}function selectedMode(){return selected&&String(q.value||'').trim().toLowerCase()===String(selected.display_name||'').trim().toLowerCase()}function height(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:p.hidden?34:34+p.offsetHeight+2},'*')}function draw(){if(selectedMode()){iw.classList.add('selected');sd.style.background=String(selected.rarity_color||'#fff');p.replaceChildren();p.hidden=true;active=-1;height();return}iw.classList.remove('selected');var m=matches(q.value);p.replaceChildren();active=m.length?Math.min(Math.max(active,0),m.length-1):-1;if(!q.value){p.hidden=true;height();return}p.hidden=false;if(!m.length){var n=document.createElement('div');n.className='none';n.textContent='No results';p.appendChild(n)}else m.forEach(function(r,i){var e=document.createElement('div'),d=document.createElement('span'),t=document.createElement('span');e.className='row'+(i===active?' active':'');d.className='diamond';d.style.background=String(r.rarity_color||'#fff');t.textContent=String(r.display_name||'');e.append(d,t);e.addEventListener('mousedown',function(x){x.preventDefault();select(r)});p.appendChild(e)});height()}function select(r){selected=r;q.value=String(r.display_name||'');p.replaceChildren();p.hidden=true;active=-1;draw();send({action:'select',item_key:r.item_key,event_id:id()})}function enter(){var m=matches(q.value);if(active>=0&&active<m.length)select(m[active]);else if(m.length===1)select(m[0])}q.addEventListener('input',draw);q.addEventListener('keydown',function(e){var m=matches(q.value);if(e.key==='ArrowDown'&&m.length){e.preventDefault();active=(active+1)%m.length;draw()}else if(e.key==='ArrowUp'&&m.length){e.preventDefault();active=(active-1+m.length)%m.length;draw()}else if(e.key==='Enter'){e.preventDefault();enter()}else if(e.key==='Escape'){p.hidden=true;height()}});window.addEventListener('message',function(e){if(!e.data||e.data.type!=='streamlit:render')return;var a=e.data.args||{};records=Array.isArray(a.records)?a.records:[];if(!initialized){selected=records.find(function(r){return r.item_key===a.selected_item})||null;q.value=selected?String(selected.display_name||''):'';initialized=true}else if(a.selected_item&&(!selected||selected.item_key!==a.selected_item)){selected=records.find(function(r){return r.item_key===a.selected_item})||null;if(selected)q.value=String(selected.display_name||'')}draw()});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*')})();</script></body></html>
