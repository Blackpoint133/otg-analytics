<!doctype html><html><body><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff}.wrap{width:100%}.input-wrap{display:flex;height:34px;background:#080808;border:1px solid #ff003a}.selected-diamond{display:none;width:8px;height:8px;flex:0 0 8px;transform:rotate(45deg);margin:12px 8px 0 9px}.selected .selected-diamond{display:block}input{flex:1;height:32px;padding:7px 9px;background:transparent;border:0;color:#fff;outline:0;font-size:13px}.selected input{padding-left:0}.panel{margin-top:2px;background:#080808;border:1px solid #303035}.row,.none{height:30px;padding:6px 9px;display:flex;gap:8px;align-items:center;font-size:13px;border-bottom:1px solid #303035}.row:hover,.row.active{background:#151515;color:#ff003a}.diamond{width:8px;height:8px;flex:0 0 8px;transform:rotate(45deg)}</style><div class="wrap"><div id="w" class="input-wrap"><span id="d" class="selected-diamond"></span><input id="q" placeholder="Search item"></div><div id="p" class="panel" hidden></div></div><script>(function(){var q=document.getElementById('q'),p=document.getElementById('p'),w=document.getElementById('w'),d=document.getElementById('d'),records=[],selected=null,browsing=false,editing=false,active=-1,selecting=false;function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}function send(v){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v,dataType:'json'},'*')}function matches(s){s=String(s||'').trim().toLowerCase();return records.filter(function(r){return !s||String(r.display_name||'').toLowerCase().indexOf(s)>=0}).sort(function(a,b){return String(a.display_name||'').toLowerCase().localeCompare(String(b.display_name||'').toLowerCase())||String(a.item_key||'').toLowerCase().localeCompare(String(b.item_key||'').toLowerCase())}).slice(0,10)}function height(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:p.hidden?34:34+p.offsetHeight},'*')}function draw(){var selectedMode=selected&&!browsing&&!editing&&q.value.trim().toLowerCase()===selected.display_name.trim().toLowerCase();if(selectedMode){w.classList.add('selected');d.style.background=selected.rarity_color||'#fff';p.replaceChildren();p.hidden=true;height();return}w.classList.remove('selected');var m=matches(browsing?'':q.value);active=m.length?Math.min(Math.max(active,0),m.length-1):-1;p.replaceChildren();if(!browsing&&!q.value){p.hidden=true;height();return}p.hidden=false;if(!m.length){var n=document.createElement('div');n.className='none';n.textContent='No results';p.appendChild(n)}else m.forEach(function(r,k){var e=document.createElement('div'),x=document.createElement('span'),t=document.createElement('span');e.className='row'+(k===active?' active':'');x.className='diamond';x.style.background=r.rarity_color||'#fff';t.textContent=r.display_name;e.append(x,t);e.onmousedown=function(ev){ev.preventDefault();selecting=true;select(r)};p.appendChild(e)});height()}function restore(){browsing=false;editing=false;active=-1;if(selected)q.value=selected.display_name;draw()}function select(r){selected=r;q.value=r.display_name;browsing=false;editing=false;p.hidden=true;active=-1;draw();send({action:'select',item_key:r.item_key,event_id:id()})}q.onfocus=function(){browsing=true;editing=false;if(selected)q.select();draw()};q.oninput=function(){if(browsing){browsing=false;editing=true}draw()};q.onblur=function(){setTimeout(function(){if(!selecting)restore();selecting=false},0)};q.onkeydown=function(e){var m=matches(browsing?'':q.value);if(e.key==='ArrowDown'&&m.length){e.preventDefault();active=(active+1)%m.length;draw()}else if(e.key==='ArrowUp'&&m.length){e.preventDefault();active=(active-1+m.length)%m.length;draw()}else if(e.key==='Enter'){e.preventDefault();if(active>=0&&active<m.length)select(m[active]);else if(m.length===1)select(m[0])}else if(e.key==='Escape'){e.preventDefault();restore()}};window.onmessage=function(e){if(!e.data||e.data.type!=='streamlit:render')return;var a=e.data.args
