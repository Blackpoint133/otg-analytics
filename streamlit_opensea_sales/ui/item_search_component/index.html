<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:inherit}.wrap{width:100%}input{width:100%;height:34px;padding:7px 9px;background:#080808;color:#fff;border:1px solid #ff003a;border-radius:0;outline:0;font-size:13px}.panel{margin-top:2px;background:#080808;border:1px solid #303035}.row,.none{height:30px;padding:6px 9px;font-size:13px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #303035}.row{cursor:pointer}.row:hover,.row.active{background:#151515;color:#ff003a}.none{color:#999}.diamond{width:8px;height:8px;flex:0 0 8px;transform:rotate(45deg);background:#fff;border:1px solid #303035}</style></head><body><div class="wrap"><input id="q" placeholder="Search item" autocomplete="off"><div id="p" class="panel" hidden></div></div><script>(function(){var q=document.getElementById('q'),p=document.getElementById('p'),records=[],selected=null,initialized=false,active=-1;function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}function send(v){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v,dataType:'json'},'*')}function draw(){var text=String(q.value||'').trim().toLowerCase();if(selected&&text===String(selected.display_name||'').trim().toLowerCase()){p.replaceChildren();p.hidden=true;active=-1;height();return}var m=text?records.filter(function(r){return String(r.display_name||'').toLowerCase().indexOf(text)>=0}).sort(function(a,b){return String(a.display_name).toLowerCase().localeCompare(String(b.display_name).toLowerCase())}).slice(0,10):[];p.replaceChildren();active=m.length?Math.min(active,m.length-1):-1;if(!text){p.hidden=true}else{p.hidden=false;if(!m.length){var n=document.createElement('div');n.className='none';n.textContent='No results';p.appendChild(n)}else m.forEach(function(r,i){var e=document.createElement('div'),d=document.createElement('span'),t=document.createElement('span');e.className='row'+(i===active?' active':'');d.className='diamond';d.style.background=String(r.rarity_color||'#fff');t.textContent=String(r.display_name||'');e.append(d,t);e.addEventListener('mousedown',function(x){x.preventDefault();select(r)});p.appendChild(e)})}height()}function height(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:p.hidden?34:34+p.offsetHeight+2},'*')}function select(r){selected=r;q.value=String(r.display_name||'');p.replaceChildren();p.hidden=true;active=-1;height();send({action:'select',item_key:r.item_key,event_id:id()})}q.addEventListener('input',draw);q.addEventListener('keydown',function(e){var m=records.filter(function(r){return String(r.display_name||'').toLowerCase().indexOf(String(q.value||'').toLowerCase())>=0}).slice(0,10);if(e.key==='ArrowDown'&&m.length){e.preventDefault();active=(active+1)%m.length;draw()}else if(e.key==='ArrowUp'&&m.length){e.preventDefault();active=(active-1+m.length)%m.length;draw()}else if(e.key==='Enter'){e.preventDefault();if(active>=0&&m[active])select(m[active]);else if(m.length===1)select(m[0])}else if(e.key==='Escape'){p.hidden=true;height()}});window.addEventListener('message',function(e){if(!e.data||e.data.type!=='streamlit:render')return;var a=e.data.args||{};records=Array.isArray(a.records)?a.records:[];if(!initialized){selected=records.find(function(r){return r.item_key===a.selected_item})||null;q.value=selected?String(selected.display_name||''):'';initialized=true}else if(a.selected_item&&(!selected||selected.item_key!==a.selected_item)){selected=records.find(function(r){return r.item_key===a.selected_item})||null;if(selected)q.value=String(selected.display_name||'')}draw()});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*')})();</script></body></html>
