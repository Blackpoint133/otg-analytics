<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:inherit}.wrap{width:100%}.input-wrap{display:flex;align-items:center;height:34px;background:#080808;border:1px solid #ff003a}.selected-diamond{display:none;width:8px;height:8px;flex:0 0 8px;transform:rotate(45deg);margin:0 8px 0 9px}.selected .selected-diamond{display:block}input{flex:1;min-width:0;height:32px;padding:7px 9px;background:transparent;color:#fff;border:0;outline:0;font-size:13px}.selected input{padding-left:0}.panel{margin-top:2px;background:#080808;border:1px solid #303035}.row,.none{height:30px;padding:6px 9px;display:flex;align-items:center;gap:8px;font-size:13px;border-bottom:1px solid #303035}.row:hover,.row.active{background:#151515;color:#ff003a}.diamond{width:8px;height:8px;flex:0 0 8px;transform:rotate(45deg)}</style></head><body><div class="wrap"><div id="iw" class="input-wrap"><span id="sd" class="selected-diamond"></span><input id="q" placeholder="Search item" autocomplete="off"></div><div id="p" class="panel" hidden></div></div><script>(function(){var q=document.getElementById('q'),p=document.getElementById('p'),iw=document.getElementById('iw'),sd=document.getElementById('sd'),records=[],selected=null,browsing=false,editing=false,active=-1;function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}function send(v){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v,dataType:'json'},'*')}function matches(text){text=String(text||'').trim().toLowerCase();return records.filter(function(r){return !text||String(r.display_name||'').toLowerCase().indexOf(text)>=0}).sort(function(a,b){return String(a.display_name||'').toLowerCase().localeCompare(String(b.display_name||'').toLowerCase())||String(a.item_key||'').toLowerCase().localeCompare(String(b.item_key||'').toLowerCase())}).slice(0,10)}function height(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:p.hidden?34:34+p.offsetHeight+2},'*')}function draw(){var selectedMode=selected&&!browsing&&!editing&&String(q.value).trim().toLowerCase()===String(selected.display_name).trim().toLowerCase();if(selectedMode){iw.classList.add('selected');sd.style.background=selected.rarity_color||'#fff';p.replaceChildren();p.hidden=true;active=-1;height();return}iw.classList.remove('selected');var m=matches(browsing?'':q.value);active=m.length?Math.min(Math.max(active,0),m.length-1):-1;p.replaceChildren();if(!browsing&&!q.value){p.hidden=true;height();return}p.hidden=false;if(!m.length){var n=document.createElement('div');n.className='none';n.textContent='No results';p.appendChild(n)}else m.forEach(function(r,k){var e=document.createElement('div'),d=document.createElement('span'),t=document.createElement('span');e.className='row'+(k===active?' active':'');d.className='diamond';d.style.background=r.rarity_color||'#fff';t.textContent=String(r.display_name||'');e.append(d,t);e.onmousedown=function(x){x.preventDefault();select(r)};p.appendChild(e)});height()}function restore(){browsing=false;editing=false;active=-1;if(selected)q.value=selected.display_name;draw()}function select(r){selected=r;browsing=false;editing=false;q.value=r.display_name;p.hidden=true;draw();send({action:'select',item_key:r.item_key,event_id:id()})}q.addEventListener('focus',function(){browsing=true;editing=false;if(selected){q.select()}draw()});q.addEventListener('input',function(){if(browsing){browsing=false;editing=true}draw()});q.addEventListener('keydown',function(e){var m=matches(browsing?'':q.value);if(e.key==='ArrowDown'&&m.length){e.preventDefault();active=(active+1)%m.length;draw()}else if(e.key==='ArrowUp'&&m.length){e.preventDefault();active=(active-1+m.length)%m.length;draw()}else if(e.key==='Enter'&&m.length===1){e.preventDefault();select(active>=0?m[active]:m[0])}else if(e.key==='Escape'){e.preventDefault();restore()}});document.addEventListener('mousedown'
