<!doctype html>
<html>
<body>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
.wrap{width:100%}
.input-wrap{display:flex;height:34px;background:#080808;border:1px solid #ff003a}
.selected-diamond,.diamond{width:8px;height:8px;flex:0 0 8px;transform:rotate(45deg)}
.selected-diamond{display:none;margin:12px 8px 0 9px}
.selected .selected-diamond{display:block}
input{flex:1;height:32px;padding:7px 9px;background:transparent;color:#fff;border:0;outline:0;font-size:13px}
.selected input{padding-left:0}
.panel{margin-top:2px;max-height:260px;overflow-y:auto;overflow-x:hidden;background:#080808;border:1px solid #303035;scrollbar-width:thin;scrollbar-color:#444 #080808}
.row,.none{height:30px;padding:6px 9px;display:flex;gap:8px;align-items:center;color:#fff;font-size:13px;border-bottom:1px solid #303035}
.row:hover,.row.active{background:#151515;color:#ff003a}
</style>
<div class="wrap"><div id="w" class="input-wrap"><span id="d" class="selected-diamond"></span><input id="q" placeholder="Search item"></div><div id="p" class="panel" hidden></div></div>
<script>
(function(){
var q=document.getElementById('q'),p=document.getElementById('p'),w=document.getElementById('w'),d=document.getElementById('d'),records=[],selected=null,browse=false,focused=false,editing=false,active=-1,choosing=false;
function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function send(v){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v,dataType:'json'},'*')}
function normalizeSearch(value){return String(value==null?'':value).replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\u00A0/g,' ').replace(/[\u2018\u2019\u201A\u201B\u0060\u00B4]/g,"'").replace(/[\u201C\u201D\u201E\u201F]/g,'"').replace(/["']/g,'').replace(/\s+/g,' ').trim().toLowerCase()}
function matches(value){var s=normalizeSearch(value);return records.filter(function(r){return !s||normalizeSearch(r.display_name).indexOf(s)>=0}).sort(function(a,b){return String(a.display_name||'').toLowerCase().localeCompare(String(b.display_name||'').toLowerCase())||String(a.item_key||'').toLowerCase().localeCompare(String(b.item_key||'').toLowerCase())})}
function height(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:p.hidden?34:Math.min(296,34+p.offsetHeight+2)},'*')}
function restore(){focused=false;editing=false;browse=false;active=-1;q.value=selected?selected.display_name:'';draw()}
function select(r){selected=r;q.value=r.display_name;focused=false;editing=false;browse=false;active=-1;draw();send({action:'select',item_key:r.item_key,event_id:id()})}
function choose(r){choosing=true;select(r);setTimeout(function(){choosing=false},0)}
function draw(){
  if(selected&&!editing&&!browse&&normalizeSearch(q.value)===normalizeSearch(selected.display_name)){
    w.classList.add('selected');d.style.background=selected.rarity_color||'#fff';p.replaceChildren();p.hidden=true;height();return
  }
  w.classList.remove('selected');
  var m=matches(focused&&!editing?'':q.value);active=m.length?Math.min(Math.max(active,-1),m.length-1):-1;p.replaceChildren();
  if(!focused&&!editing){p.hidden=true;height();return}
  p.hidden=false;
  m.forEach(function(r,k){var e=document.createElement('div'),x=document.createElement('span'),t=document.createElement('span');e.className='row'+(k===active?' active':'');x.className='diamond';x.style.background=r.rarity_color||'#fff';t.textContent=r.display_name;e.append(x,t);e.onmousedown=function(ev){ev.preventDefault();choose(r)};p.append(e)});
  if(!m.length){var n=document.createElement('div');n.className='none';n.textContent='No results';p.append(n)}
  height()
}
q.onfocus=function(){focused=true;editing=false;browse=true;active=-1;if(selected)q.select();draw()}
q.oninput=function(){focused=true;editing=true;browse=false;active=-1;draw()}
q.addEventListener('paste',function(e){
  var text=e.clipboardData&&e.clipboardData.getData('text/plain');
  if(typeof text!=='string')return;
  e.preventDefault();
  var start=q.selectionStart==null?q.value.length:q.selectionStart,end=q.selectionEnd==null?start:q.selectionEnd;
  q.value=q.value.slice(0,start)+text+q.value.slice(end);focused=true;editing=true;browse=false;active=-1;draw()
})
q.onkeydown=function(e){var m=matches(focused&&!editing?'':q.value);if(e.key==='ArrowDown'&&m.length){e.preventDefault();active=active<0?0:(active+1)%m.length;draw();p.children[active]&&p.children[active].scrollIntoView({block:'nearest'})}else if(e.key==='ArrowUp'&&m.length){e.preventDefault();active=active<0?m.length-1:(active-1+m.length)%m.length;draw();p.children[active]&&p.children[active].scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){e.preventDefault();if(active>=0&&active<m.length)choose(m[active]);else if(m.length===1)choose(m[0])}else if(e.key==='Escape'){e.preventDefault();restore()}}
q.onblur=function(){setTimeout(function(){if(!choosing)restore()},0)}
window.onmessage=function(e){if(!e.data||e.data.type!=='streamlit:render')return;var a=e.data.args||{};records=Array.isArray(a.records)?a.records:[];selected=records.find(function(r){return r.item_key===a.selected_item})||null;if(!(focused&&editing))q.value=selected?selected.display_name:'';draw()}
parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*')
})();
</script>
</body>
</html>
