<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:inherit}.wrap{width:100%}.input{display:flex;height:34px;background:#080808;border:1px solid #ff003a}.input.selected .dot{display:block}.dot{display:none;width:8px;height:8px;flex:0 0 8px;transform:rotate(45deg);margin:12px 8px 0 9px}input{flex:1;height:32px;min-width:0;padding:7px 9px;background:transparent;border:0;outline:0;color:#fff;font-size:13px}.selected input{padding-left:0}.panel{margin-top:2px;background:#080808;border:1px solid #303035}.row,.none{height:30px;padding:6px 9px;font-size:13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #303035}.row:hover,.row.active{background:#151515;color:#ff003a}.none{color:#999}</style></head><body><div class="wrap"><div id="i" class="input"><span id="d" class="dot"></span><input id="q" placeholder="Search trader name or wallet"><div id="p" class="panel" hidden></div></div></div><script>(function(){var q=document.getElementById('q'),p=document.getElementById('p'),i=document.getElementById('i'),d=document.getElementById('d'),records=[],selected=null,active=-1,init=false;function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}function send(v){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v,dataType:'json'},'*')}function matches(s){s=String(s||'').trim().toLowerCase();var b=s.indexOf('0x')===0?s.slice(2):s;return records.filter(function(r){var w=String(r.wallet||'').toLowerCase(),n=String(r.display_name||'').toLowerCase(),u=String(r.username||'').toLowerCase();return n.indexOf(s)>=0||u.indexOf(s)>=0||w.indexOf(s)>=0||w.slice(2).indexOf(b)>=0}).sort(function(a,b){return (b.trade_count||0)-(a.trade_count||0)||String(a.display_name).toLowerCase().localeCompare(String(b.display_name).toLowerCase())||String(a.wallet).toLowerCase().localeCompare(String(b.wallet).toLowerCase())}).slice(0,10)}function height(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:p.hidden?34:34+p.offsetHeight+2},'*')}function draw(){var m=matches(q.value);p.replaceChildren();if(selected&&String(q.value).trim().toLowerCase()===String(selected.display_name).trim().toLowerCase()){p.hidden=true;i.classList.add('selected');d.style.background=selected.rarity_color||'#fff';height();return}i.classList.remove('selected');active=m.length?Math.min(Math.max(active,0),m.length-1):-1;p.hidden=false;if(!m.length){var n=document.createElement('div');n.className='none';n.textContent='No results';p.appendChild(n)}else m.forEach(function(r,k){var e=document.createElement('div');e.className='row'+(k===active?' active':'');e.textContent=String(r.display_name||'');e.addEventListener('mousedown',function(x){x.preventDefault();selected=r;q.value=r.display_name;p.hidden=true;active=-1;draw();send({action:'select',wallet:r.wallet,event_id:id()})});p.appendChild(e)});height()}q.addEventListener('focus',function(){draw()});q.addEventListener('input',draw);q.addEventListener('keydown',function(e){var m=matches(q.value);if(e.key==='ArrowDown'&&m.length){e.preventDefault();active=(active+1)%m.length;draw()}else if(e.key==='ArrowUp'&&m.length){e.preventDefault();active=(active-1+m.length)%m.length;draw()}else if(e.key==='Enter'&&m.length===1){e.preventDefault();selected=m[0];q.value=selected.display_name;draw();send({action:'select',wallet:selected.wallet,event_id:id()})}else if(e.key==='Escape'){p.hidden=true;height()}});window.addEventListener('message',function(e){if(!e.data||e.data.type!=='streamlit:render')return;var a=e.data.args||{};records=Array.isArray(a.records)?a.records:[];if(!init){selected=records.find(function(r){return r.wallet===a.selected_wallet})||null;q.value=selected?selected.display_name:'';init=true}draw()});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*')})();</script></body></html>
