<!doctype html><html><body><style>input{width:100%;height:34px;background:#080808;color:#fff;border:1px solid #ff003a;font-size:13px}.panel{background:#080808;border:1px solid #303035}.row,.none{padding:7px;border-bottom:1px solid #303035;color:#fff}.row:hover,.row.active{background:#151515;color:#ff003a}</style><div class="wrap"><div class="input"><input id="q" placeholder="Search trader name or wallet"></div><div id="p" class="panel" hidden></div></div><script>(function(){var q=document.getElementById('q'),p=document.getElementById('p'),records=[],selected=null,focused=false,editing=false,active=-1,clearSent=false;function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}function send(v){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v,dataType:'json'},'*')}function matches(s){s=String(s||'').trim().toLowerCase();var b=s.indexOf('0x')===0?s.slice(2):s;return records.map(function(r){var w=String(r.wallet).toLowerCase(),n=String(r.display_name).toLowerCase(),u=String(r.username||'').toLowerCase(),x=-1;if(!s)x=10;else if(/^0x[0-9a-f]{40}$/.test(s)&&w===s)x=0;else if(n===s)x=1;else if(u===s)x=2;else if(n.indexOf(s)===0)x=3;else if(u.indexOf(s)===0)x=4;else if(w.indexOf(s)===0)x=5;else if(w.slice(2).indexOf(b)===0)x=6;else if(n.indexOf(s)>=0)x=7;else if(u.indexOf(s)>=0)x=8;else if(w.indexOf(s)>=0||w.slice(2).indexOf(b)>=0)x=9;return x<0?null:{r:r,x:x}}).filter(Boolean).sort(function(a,b){return a.x-b.x||(b.r.trade_count||0)-(a.r.trade_count||0)||String(a.r.display_name).localeCompare(String(b.r.display_name))||String(a.r.wallet).localeCompare(String(b.r.wallet))}).slice(0,10).map(function(x){return x.r})}function height(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:p.hidden?34:34+p.offsetHeight},'*')}function draw(){var m=matches(focused&&!editing?'':q.value);p.replaceChildren();if(!focused&&!q.value){p.hidden=true;height();return}p.hidden=false;active=m.length?Math.min(Math.max(active,0),m.length-1):-1;m.forEach(function(r,k){var e=document.createElement('div');e.className='row'+(k===active?' active':'');e.textContent=r.display_name;e.onmousedown=function(z){z.preventDefault();selected=r;q.value=r.display_name;focused=false;editing=false;p.hidden=true;draw();send({action:'select',wallet:r.wallet,event_id:id()})};p.appendChild(e)});if(!m.length){var n=document.createElement('div');n.className='none';n.textContent='No results';p.appendChild(n)}height()}function restore(){focused=false;editing=false;active=-1;if(selected)q.value=selected.display_name;draw()}q.onfocus=function(){focused=true;editing=false;if(selected)q.select();draw()};q.oninput=function(){if(focused&&!editing)editing=true;if(!q.value&&selected&&!clearSent){clearSent=true;selected=null;send({action:'clear',event_id:id()})}draw()};q.onkeydown=function(e){var m=matches(focused&&!editing?'':q.value);if(e.key==='ArrowDown'&&m.length){e.preventDefault();active=(active+1)%m.length;draw()}else if(e.key==='ArrowUp'&&m.length){e.preventDefault();active=(active-1+m.length)%m.length;draw()}else if(e.key==='Enter'&&m.length){e.preventDefault();var r=active>=0?m[active]:m.length===1?m[0]:null;if(r){selected=r;q.value=r.display_name;focused=false;editing=false;draw();send({action:'select',wallet:r.wallet,event_id:id()})}}else if(e.key==='Escape'){restore()}};q.onblur=function(){setTimeout(function(){if(!p.matches(':hover'))restore()},0)};window.onmessage=function(e){if(!e.data||e.data.type!=='streamlit:render')return;var a=e.data.args||{};records=Array.isArray(a.records)?a.records:[];selected=a.selected_wallet?records.find(function(r){return String(r.wallet).toLowerCase()===String(a.selected_wallet).toLowerCase()}):null;if(!focused&&!editing)q.value=selected?selected.display_name:'';clearSent=false;draw()};parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*')})();</script></body></html>
