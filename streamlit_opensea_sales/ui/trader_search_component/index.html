<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:inherit}.wrap{width:100%}input{width:100%;height:34px;padding:7px 9px;background:#080808;color:#fff;border:1px solid #ff003a;border-radius:0;outline:0}.panel{margin-top:2px;background:#080808;border:1px solid #303035}.row,.none{height:30px;padding:6px 9px;border-bottom:1px solid #303035;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row:last-child,.none:last-child{border-bottom:0}.row{cursor:pointer}.row:hover,.row.active{background:#151515;color:#ff003a}.none{color:#999}
</style></head><body><div class="wrap"><input id="q" type="text" placeholder="Search trader name or wallet" autocomplete="off" oninput=""><div id="p" class="panel" hidden></div></div><script>
(function(){
var input=document.getElementById('q'),panel=document.getElementById('p'),records=[],serverSelectedWallet=null,localSelectedWallet=null,selectedDisplayName='',initialized=false,localDirty=false,clearSent=false,active=-1;
function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function send(value){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:value,dataType:'json'},'*')}
function norm(v){return String(v||'').trim().toLowerCase()}
function body(w){var x=norm(w);return x.indexOf('0x')===0?x.slice(2):x}
function results(query){var q=norm(query),qb=q.indexOf('0x')===0?q.slice(2):q,full=/^0x[0-9a-f]{40}$/.test(q),out=[];if(!q)return out;records.forEach(function(r){var w=norm(r.wallet),b=body(w),n=norm(r.display_name),u=norm(r.username),p=-1;if(full&&w===q)p=0;else if(n===q)p=1;else if(u&&u===q)p=2;else if(n.indexOf(q)===0)p=3;else if(u&&u.indexOf(q)===0)p=4;else if(w.indexOf(q)===0)p=5;else if(b.indexOf(q)===0)p=6;else if(n.indexOf(q)>=0)p=7;else if(u&&u.indexOf(q)>=0)p=8;else if(w.indexOf(q)>=0||b.indexOf(q)>=0)p=9;if(p>=0)out.push({p:p,r:r})});out.sort(function(a,b){return a.p-b.p||norm(a.r.display_name).localeCompare(norm(b.r.display_name))||norm(a.r.wallet).localeCompare(norm(b.r.wallet))});return out.slice(0,10).map(function(x){return x.r})}
function height(){var h=34;if(!panel.hidden)h+=panel.offsetHeight+2;parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}
function clearOnce(){if((localSelectedWallet||serverSelectedWallet)&&!clearSent){send({action:'clear',event_id:id()});clearSent=true;localSelectedWallet=null;serverSelectedWallet=null}}
function draw(){var m=results(input.value);panel.replaceChildren();active=m.length?Math.min(active,m.length-1):-1;if(input.value){panel.hidden=false;if(!m.length){var e=document.createElement('div');e.className='none';e.textContent='No results';panel.appendChild(e)}else m.forEach(function(r,i){var e=document.createElement('div');e.className='row'+(i===active?' active':'');e.textContent=String(r.display_name||'');e.addEventListener('mousedown',function(ev){ev.preventDefault();select(r)});panel.appendChild(e)})}else panel.hidden=true;height()}
function select(r){localSelectedWallet=r.wallet;serverSelectedWallet=r.wallet;selectedDisplayName=String(r.display_name||'');localDirty=false;clearSent=false;input.value=selectedDisplayName;panel.hidden=true;draw();send({action:'select',wallet:r.wallet,display_name:selectedDisplayName,event_id:id()})}
function enter(){var m=results(input.value),q=norm(input.value),r=null;if(active>=0&&active<m.length)r=m[active];else if(/^0x[0-9a-f]{40}$/.test(q))r=records.find(function(x){return norm(x.wallet)===q});else {var n=records.filter(function(x){return norm(x.display_name)===q}),u=records.filter(function(x){return norm(x.username)===q});if(n.length===1)r=n[0];else if(u.length===1)r=u[0];else if(m.length===1)r=m[0]}if(r)select(r)}
input.addEventListener('input',function(){if(localSelectedWallet&&norm(input.value)!==norm(selectedDisplayName))clearOnce();localDirty=true;draw()});input.addEventListener('keydown',function(e){var m=results(input.value);if(e.key==='ArrowDown'){e.preventDefault();if(m.length){active=(active+1)%m.length;draw()}}else if(e.key==='ArrowUp'){e.preventDefault();if(m.length){active=(active-1+m.length)%m.length;draw()}}else if(e.key==='Enter'){e.preventDefault();enter()}else if(e.key==='Escape'){panel.hidden=true;height()}});
document.addEventListener('mousedown',function(e){if(!document.querySelector('.wrap').contains(e.target)){panel.hidden=true;height()}});
window.addEventListener('message',function(e){if(!e.data||e.data.type!=='streamlit:render')return;var a=e.data.args||{};records=Array.isArray(a.records)?a.records:[];var sw=a.selected_wallet?norm(a.selected_wallet):null;if(!initialized){serverSelectedWallet=sw;localSelectedWallet=sw;selectedDisplayName=String(a.selected_display_name||'');input.value=sw?selectedDisplayName:String(a.initial_query||'');initialized=true;draw();return}if(sw&&sw!==serverSelectedWallet){serverSelectedWallet=sw;localSelectedWallet=sw;selectedDisplayName=String(a.selected_display_name||'');input.value=selectedDisplayName;localDirty=false;clearSent=false}else if(!sw&&clearSent){serverSelectedWallet=null;localSelectedWallet=null;clearSent=false}draw()});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');})();
</script></body></html>
