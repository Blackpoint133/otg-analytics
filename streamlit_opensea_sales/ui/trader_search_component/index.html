<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:#fff;font-family:Arial,sans-serif}.wrap{width:100%}input{width:100%;height:34px;padding:7px 9px;background:#080808;color:#fff;border:1px solid #ff003a;border-radius:0;outline:0;font:13px Arial,sans-serif}.panel{margin-top:2px;max-height:260px;overflow-y:auto;overflow-x:hidden;background:#080808;border:1px solid #303035;scrollbar-width:thin;scrollbar-color:#444 #080808}.row,.none{min-height:30px;padding:7px 9px;border-bottom:1px solid #303035;font:13px Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.row:hover,.row.active{background:#151515;color:#ff003a}.all{position:sticky;top:0;z-index:2;background:#080808}.none{color:#999;cursor:default}</style></head><body><div class="wrap"><input id="q" type="text" placeholder="Search trader name or wallet" autocomplete="off"><div id="p" class="panel" hidden></div></div><script>(function(){var q=document.getElementById('q'),p=document.getElementById('p'),records=[],selected=null,focused=false,editing=false,active=-1,clearSent=false,choosing=false;function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}function send(v){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v,dataType:'json'},'*')}function matches(s){s=String(s||'').trim().toLowerCase();var b=s.indexOf('0x')===0?s.slice(2):s;return records.map(function(r){var w=String(r.wallet||'').toLowerCase(),n=String(r.display_name||'').toLowerCase(),u=String(r.username||'').toLowerCase(),x=-1;if(!s)x=10;else if(/^0x[0-9a-f]{40}$/.test(s)&&w===s)x=0;else if(n===s)x=1;else if(u===s)x=2;else if(n.indexOf(s)===0)x=3;else if(u.indexOf(s)===0)x=4;else if(w.indexOf(s)===0)x=5;else if(w.slice(2).indexOf(b)===0)x=6;else if(n.indexOf(s)>=0)x=7;else if(u.indexOf(s)>=0)x=8;else if(w.indexOf(s)>=0||w.slice(2).indexOf(b)>=0)x=9;return x<0?null:{r:r,x:x}}).filter(Boolean).sort(function(a,b){return a.x-b.x||(b.r.trade_count||0)-(a.r.trade_count||0)||String(a.r.display_name||'').toLowerCase().localeCompare(String(b.r.display_name||'').toLowerCase())||String(a.r.wallet||'').toLowerCase().localeCompare(String(b.r.wallet||'').toLowerCase())}).map(function(x){return x.r})}function height(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:p.hidden?34:Math.min(296,34+p.offsetHeight+2)},'*')}function restore(){focused=false;editing=false;active=-1;clearSent=false;q.value=selected?selected.display_name:'All Wallets';draw()}function choose(r){choosing=true;if(r===null){selected=null;q.value='All Wallets';focused=false;editing=false;clearSent=true;p.hidden=true;draw();send({action:'clear',event_id:id()})}else{selected=r;q.value=r.display_name;focused=false;editing=false;clearSent=false;active=-1;p.hidden=true;draw();send({action:'select',wallet:r.wallet,event_id:id()})}setTimeout(function(){choosing=false},0)}function draw(){var m=matches(focused&&!editing?'':q.value);p.replaceChildren();if(!focused){p.hidden=true;height();return}p.hidden=false;var a=document.createElement('div');a.className='row all'+(active===0?' active':'');a.textContent='All Wallets';a.onmousedown=function(e){e.preventDefault();choose(null)};p.appendChild(a);m.forEach(function(r,k){var e=document.createElement('div');e.className='row'+(k+1===active?' active':'');e.textContent=r.display_name;e.onmousedown=function(z){z.preventDefault();choose(r)};p.appendChild(e)});if(!m.length){var n=document.createElement('div');n.className='none';n.textContent='No results';p.appendChild(n)}height()}q.onfocus=function(){focused=true;editing=false;active=-1;if(selected||q.value==='All Wallets')q.select();draw()};q.oninput=function(){if(focused&&!editing)editing=true;if(!q.value&&selected&&!clearSent){clearSent=true;selected=null;send({action:'clear',event_id:id()})}draw()};q.onkeydown=function(e){var m=matches(focused&&!editing?'':q.value),count=m.length+1;if(e.key==='ArrowDown'&&count){e.preventDefault();active=active<0?0:(active+1)%count;draw();p.children[active]&&p.children[active].scrollIntoView({block:'nearest'})}else if(e.key==='ArrowUp'&&count){e.preventDefault();active=active<0?count-1:(active-1+count)%count;draw();p.children[active]&&p.children[active].scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){e.preventDefault();if(active===0)choose(null);else if(active>0&&active<=m.length)choose(m[active-1]);else if(m.length===1)choose(m[0])}else if(e.key==='Escape'){e.preventDefault();restore()}};q.onblur=function(){setTimeout(function(){if(!choosing)restore()},0)};window.onmessage=function(e){if(!e.data||e.data.type!=='streamlit:render')return;var a=e.data.args||{};records=Array.isArray(a.records)?a.records:[];selected=a.selected_wallet?records.find(function(r){return String(r.wallet).toLowerCase()===String(a.selected_wallet).toLowerCase()})||null:null;if(!focused&&!editing)q.value=selected?selected.display_name:'All Wallets';clearSent=false;draw()};parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*')})();</script></body></html>
